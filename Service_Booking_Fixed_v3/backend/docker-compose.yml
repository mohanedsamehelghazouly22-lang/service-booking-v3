services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: service_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
  api:
    build: .
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@db:5432/service_booking
      JWT_SECRET: change-me-in-production
      OTP_DEV_MODE: "true"
      OTP_TTL_MINUTES: 5
      CORS_ORIGIN: "*"
    ports: ["8080:8080"]
    depends_on: [db]
volumes:
  pgdata:
